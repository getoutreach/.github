name: Schedule Shared Actions
on:
  schedule:
    - cron: "0 0 1 * *"

jobs:
  opslevel:
    name: OpsLevel
    uses: getoutreach/actions/.github/workflows/opslevel.yaml@artemchernyak-outreach/feat/opslevel-action
    runs-on: ubuntu-latest
    secrets:
      OUTREACH_DOCKER_JSON: ${{ secrets.OUTREACH_DOCKER_JSON }}
      SLACK_TOKEN: ${{ secrets.SLACK_TOKEN }}
      OPSLEVEL_TOKEN: ${{ secrets.OPSLEVEL_TOKEN }}
    with:
      branch: artemchernyak-outreach/feat/opslevel-action
      image_tag: development
