name: Schedule Shared Actions
on:
  schedule:
    # runs at 19:00 UTC (12:00 PDT) on Monday
    - cron: "0 19 * * 1"

jobs:
  opslevel:
    name: OpsLevel
    uses: getoutreach/outreach-actions/.github/workflows/opslevel.yaml@main
    secrets:
      OUTREACH_DOCKER_JSON: ${{ secrets.OUTREACH_DOCKER_JSON }}
      SLACK_TOKEN: ${{ secrets.SLACK_TOKEN }}
      OPSLEVEL_TOKEN: ${{ secrets.OPSLEVEL_TOKEN }}
    with:
      image_tag: latest
